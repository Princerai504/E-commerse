  <text x="300" y="455" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#6d28d9" text-anchor="middle" letter-spacing="0.5">Photo coming soon</text>
  <text x="300" y="492" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8b8db2" text-anchor="middle">Add your image in public/images/products</text>
