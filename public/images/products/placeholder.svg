  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect x="40" y="40" width="520" height="520" rx="32" fill="none" stroke="#c7d2fe" stroke-width="4" stroke-dasharray="18 14"/>
  <circle cx="300" cy="270" r="96" fill="url(#icon)" opacity="0.12"/>
  <g transform="translate(300 270)">
    <rect x="-58" y="-44" width="116" height="88" rx="18" fill="#6d28d9" opacity="0.92"/>
